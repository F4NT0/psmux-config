# psmux Configuration File
# This file is compatible with tmux configuration syntax
# Place this file in your home directory as ~/.tmux.conf

# Change prefix from Ctrl+b to Ctrl+a (optional, uncomment to use)
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# Enable mouse support (default: on)
set -g mouse on

# Set default shell
set -g default-shell "pwsh"

# Set terminal type
set -g default-terminal "xterm-256color"

# Enable 24-bit true color support
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar configuration
set -g status-position bottom
set -g status-bg black
set -g status-fg white
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=green](#S) '
set -g status-right-length 60
set -g status-right '#[fg=yellow]%H:%M #[fg=white]%d-%b-%y'

# Window status
set -g window-status-format '#I:#W#F'
set -g window-status-current-format '#[fg=yellow,bold]#I:#W#F'

# Pane borders
set -g pane-border-style fg=black
set -g pane-active-border-style fg=green

# Increase history limit
set -g history-limit 10000

# Set base index to 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable vi-mode in copy mode
setw -g mode-keys vi

# Copy mode with mouse scroll
set -g scroll-enter-copy-mode on

# Custom keybindings (optional)
# bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi y send-keys -X copy-selection

# Auto restore sessions (requires psmux-resurrect plugin)
# set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-vim 'session'
# set -g @resurrect-strategy-nvim 'session'
