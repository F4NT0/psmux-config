# ─────────────────────
# PSMux Configuration
# ─────────────────────

# Change prefix to Ctrl+a (more common than Ctrl+b)
set -g prefix C-a

# Use PowerShell as default shell (Windows default)
set -g default-shell powershell

# Status bar configuration
set -g status-left "[#S] "
set -g status-right "%H:%M %d-%b-%y"
set -g status-style "bg=black,fg=white"

# Status bar position
set -g status-position top

# Window List with separators
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W* "
set -g window-status-current-style "bg=#006400,fg=white,bold"
set -g window-status-separator " | "

# Mouse support
set -g mouse on

# Key bindings
bind-key -T prefix h split-window -h
bind-key -T prefix v split-window -v

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history limit
set -g history-limit 5000

# ─────────────────────
# Plugins (PPM)
# ─────────────────────
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-resurrect'

# Initialize PPM (keep this line at the very bottom of .psmux.conf)
run '~/.psmux/plugins/ppm/ppm.ps1'
